[package]
name = "vr-rust-game"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.33.5", features = ["bytemuck"] }
rapier3d = "0.35.2"
wgpu = "28"
indite = { git = "https://github.com/celphase/indite" }
# openxr = "0.21"
# TODO: Figure out if this is working properly
ctrlc = "3.5.2"
anyhow = "1.0.104"
bytemuck = "1.25.2"
gltf = "1.4.1"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
pollster = "1.0.1"
futures-intrusive = "0.5.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
openxr = { version = "0.21", features = ["static"] }
msgbox = "0.7.0"
winit = "0.30.13"

# Just like ignore the .dll / .so made by this
[lib]
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "vr-rust-game"
path = "src/main.rs"

# Oculus / OpenXR support
[package.metadata.android.signing.release]
path = "/home/birdguy/.android/debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

[target.'cfg(target_os = "android")'.dependencies]
openxr = { version = "0.21", features = ["loaded"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }

[package.metadata.android]
package = "com.birdguy.vrrustgame"
apk_name = "vr-rust-game"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 29
target_sdk_version = 32
runtime_libs = "android/libs"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vr.headtracking"
required = true
version = 1

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 1

[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR"
[[package.metadata.android.uses_permission]]
name = "org.khronos.openxr.permission.OPENXR_SYSTEM"

[[package.metadata.android.application.meta_data]]
name = "com.oculus.supportedDevices"
value = "all"

[package.metadata.android.application.activity]
config_changes = "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = [
  "android.intent.category.LAUNCHER",
  "com.oculus.intent.category.VR",
  "org.khronos.openxr.intent.category.IMMERSIVE_HMD",
]
